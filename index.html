<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klassikerplaneraren</title>
    <meta
      name="description"
      content="Skapa ett personligt träningsprogram för En svensk klassiker: Vasaloppet, Vätternrundan, Vansbrosimningen och Lidingöloppet."
    />
  </head>
  <body>
    <main>
      <header>
        <h1>Klassikerplaneraren</h1>
        <p class="lead">
          Ett träningsprogram för alla fyra grenarna i En Svensk Klassiker — periodiserat mot dina
          egna loppdatum och anpassat efter säsong.
        </p>
      </header>

      <section id="form-root" aria-label="Dina förutsättningar"></section>

      <!--
        Statusraden är den enda delen som läses upp automatiskt. Låg
        aria-live på hela programmet skulle få skärmläsaren att läsa upp
        femtioen veckor i följd varje gång ett program skapas.
      -->
      <p id="status" role="status" tabindex="-1" class="status" hidden></p>

      <section id="program-root" aria-label="Ditt program"></section>
      <footer id="disclaimer-root"></footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
